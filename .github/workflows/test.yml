name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Read-only by default; no job here writes to the repo.
permissions:
  contents: read

# Every action below is pinned to a commit SHA, not a tag: a tag is mutable
# and can be repointed by anyone who compromises the action's repo, which is
# the standard Actions supply-chain attack. The trailing comment records the
# human-readable version each SHA maps to. Same rule as release.yml.
jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One OS failing shouldn't cancel the others: a flaky test on one
      # runner would otherwise hide the Windows results.
      fail-fast: false
      matrix:
        # Windows runs the suite so contributors there can trust
        # `go test ./...` (issue #288, phase 1). The REPL's raw-mode input
        # and the bash tool are not supported on Windows yet; tests that
        # need them must skip there (t.Skip) with a reason.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Exact patch pin, matching go.mod's toolchain directive and
        # release.yml. The patch level is load-bearing for the stdlib
        # CVEs govulncheck tracks — bump all three together.
        go-version: ['1.27.2']
    # Git Bash on the Windows runner, so every step reads the same on all
    # three (PowerShell would split -coverprofile=coverage.txt at the dot).
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: false

    - name: Get dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      run: go vet ./...

    - name: Run tests with coverage
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Build
      run: go build -v ./cmd/cortex

    - name: Verify study-subagent contract
      if: matrix.os == 'ubuntu-latest'
      run: ./scripts/verify-study.sh

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
      if: matrix.os == 'ubuntu-latest'
      with:
        file: ./coverage.txt
        flags: unittests
        name: codecov-umbrella

  identity:
    name: Commit identity
    # Only a PR has a commit range to judge; pushes to main are squash merges
    # credited to whoever merged.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
        fetch-depth: 0

    # Agent commits must carry a githug identity, not the maintainer's
    # (scripts/ci/commit-identity.sh explains the rule).
    - name: Check commit authors
      run: ./scripts/ci/commit-identity.sh "$BASE_SHA" "$HEAD_SHA"
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.27.2'
        check-latest: false

    # govulncheck reports only vulnerabilities the code actually reaches,
    # so unlike a dependency-graph alert this failing means a real call
    # path exists. Pinned, not @latest: an unpinned `go install` in CI is
    # the same mutable-supply-chain hole as an unpinned action tag.
    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

    - name: Scan
      run: govulncheck ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.27.2'
        check-latest: false

    - name: Install golangci-lint from source
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

    - name: Run golangci-lint
      run: golangci-lint run --timeout=5m

  build:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: [test, lint, vuln]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.27.2'
        check-latest: false

    - name: Build for Linux
      run: GOOS=linux GOARCH=amd64 go build -trimpath -o cortex-linux-amd64 ./cmd/cortex

    - name: Build for macOS (Intel)
      run: GOOS=darwin GOARCH=amd64 go build -trimpath -o cortex-darwin-amd64 ./cmd/cortex

    - name: Build for macOS (Apple Silicon)
      run: GOOS=darwin GOARCH=arm64 go build -trimpath -o cortex-darwin-arm64 ./cmd/cortex

    # Built so the Windows compile can't regress; not a release target
    # yet (issue #288).
    - name: Build for Windows
      run: GOOS=windows GOARCH=amd64 go build -trimpath -o cortex-windows-amd64.exe ./cmd/cortex

    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: binaries
        path: |
          cortex-*
        retention-days: 7
