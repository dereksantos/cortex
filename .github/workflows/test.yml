name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Read-only by default; no job here writes to the repo.
permissions:
  contents: read

# Every action below is pinned to a commit SHA, not a tag: a tag is mutable
# and can be repointed by anyone who compromises the action's repo, which is
# the standard Actions supply-chain attack. The trailing comment records the
# human-readable version each SHA maps to. Same rule as release.yml.
jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Windows excluded: the eval-harness work relies on POSIX
        # subprocess group semantics (syscall.Setpgid, SIGTERM/SIGKILL
        # via PID groups) that have no clean Windows equivalent. Files
        # needing exclusion already carry //go:build !windows tags so
        # local builds on Windows fail fast rather than silently
        # misbehaving. Re-adding Windows to CI would require a shim
        # layer for subprocess lifecycle — significantly more code than
        # the exclusion saves.
        os: [ubuntu-latest, macos-latest]
        # Exact patch pin, matching go.mod's toolchain directive and
        # release.yml. The patch level is load-bearing for the stdlib
        # CVEs govulncheck tracks — bump all three together.
        go-version: ['1.26.6']

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: false

    - name: Get dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      run: go vet ./...

    - name: Run tests with coverage
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Build
      run: go build -v ./cmd/cortex

    - name: Verify study-subagent contract
      if: matrix.os == 'ubuntu-latest'
      run: ./scripts/verify-study.sh

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
      if: matrix.os == 'ubuntu-latest'
      with:
        file: ./coverage.txt
        flags: unittests
        name: codecov-umbrella

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: '1.26.6'
        check-latest: false

    # govulncheck reports only vulnerabilities the code actually reaches,
    # so unlike a dependency-graph alert this failing means a real call
    # path exists. Pinned, not @latest: an unpinned `go install` in CI is
    # the same mutable-supply-chain hole as an unpinned action tag.
    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

    - name: Scan
      run: govulncheck ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: '1.26.6'
        check-latest: false

    - name: Install golangci-lint from source
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

    - name: Run golangci-lint
      run: golangci-lint run --timeout=5m

  build:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: [test, lint, vuln]

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: '1.26.6'
        check-latest: false

    - name: Build for Linux
      run: GOOS=linux GOARCH=amd64 go build -trimpath -o cortex-linux-amd64 ./cmd/cortex

    - name: Build for macOS (Intel)
      run: GOOS=darwin GOARCH=amd64 go build -trimpath -o cortex-darwin-amd64 ./cmd/cortex

    - name: Build for macOS (Apple Silicon)
      run: GOOS=darwin GOARCH=arm64 go build -trimpath -o cortex-darwin-arm64 ./cmd/cortex

    # Windows build dropped — see matrix comment above. We're not
    # shipping a Windows binary while the eval-harness work blocks it.

    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries
        path: |
          cortex-*
        retention-days: 7
