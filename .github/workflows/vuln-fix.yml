name: Vulnerability fix

# On-demand only. Renovate owns routine dependency updates and now covers
# indirect Go deps too (renovate.json), so this is not a second update bot —
# it's the "a CVE just landed and I don't want to wait for the bot's schedule"
# button. Run it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scan and report only — do not open a PR"
        type: boolean
        default: false

permissions: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Actions pinned to commit SHAs, not tags — same rule as the other
      # workflows here. The trailing comment records the version.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          check-latest: false

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan and upgrade
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ./scripts/vuln-fix.sh --dry-run
          else
            ./scripts/vuln-fix.sh
          fi

      # No-op when the script found nothing: with no diff, create-pull-request
      # exits cleanly without opening anything.
      #
      # Caveat worth knowing: a PR opened with GITHUB_TOKEN does NOT trigger
      # other workflows, so test.yml will not run on it by default. That is a
      # deliberate GitHub guard against workflows recursively triggering
      # themselves. Either close/reopen the PR to kick CI, or set a
      # fine-grained PAT as VULN_FIX_TOKEN and swap it in for `token:` below.
      # Left on GITHUB_TOKEN so this works with no secret to configure — but
      # do not merge one of these without a green run.
      - name: Open pull request
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: security/vuln-fix
          delete-branch: true
          title: "fix(deps): upgrade reachable vulnerable dependencies"
          commit-message: |
            fix(deps): upgrade reachable vulnerable dependencies

            Generated by .github/workflows/vuln-fix.yml. Upgrades only the
            modules govulncheck reports as reachable — code the binary
            actually calls — to the exact version it names as the fix.
          body: |
            Opened by the **Vulnerability fix** workflow (`scripts/vuln-fix.sh`).

            Upgrades only the dependencies `govulncheck` reports as **reachable**
            — code this binary actually calls, not merely modules it requires —
            each to the exact version govulncheck names as the fix. Routine
            version churn stays with Renovate.

            The workflow ran `go build`, `go test`, and a re-scan before opening
            this. **CI does not run automatically on PRs opened by
            `GITHUB_TOKEN`** — close and reopen this PR to trigger it, and don't
            merge without a green run.
