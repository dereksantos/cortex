# GoReleaser config (docs/model-self-healing.md era release plumbing; the
# process itself is documented in CONTRIBUTING.md). Triggered by
# .github/workflows/release.yml on a v* tag push. Free/OSS tier only.
#
# The archive name_template below is load-bearing: scripts/install.sh
# reconstructs it (cortex_<version>_<os>_<arch>.tar.gz) to download the
# right asset — change one, change both.
version: 2

project_name: cortex

before:
  hooks:
    # Verify, never mutate. The old `go mod tidy` hook rewrote go.mod/go.sum
    # during the release, so the artifacts wouldn't necessarily correspond to
    # the dependency set that was reviewed and scanned at the tagged commit.
    # Tidiness is enforced per-push by CI instead.
    - go mod verify

# Strip paths that leak the builder's filesystem layout into the binary and
# make two builds of the same commit differ.
gomod:
  mod: mod

report_sizes: true

builds:
  - id: cortex
    main: ./cmd/cortex
    binary: cortex
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    # Reproducibility: -trimpath drops the builder's absolute paths from the
    # binary, and mod_timestamp pins the archive/binary mtime to the commit
    # date instead of "whenever CI happened to run". Together they let anyone
    # rebuild the tag and get bit-identical output to compare against the
    # published provenance attestation.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

# The auto-generated commit changelog is off. v0.3.0 is the first tag this
# repo has ever pushed, so GoReleaser would have no previous tag to diff
# against and would dump every feat/fix since the beginning — over a
# thousand commits — into the release body. CHANGELOG.md is the curated
# summary and the release header links straight to it. Revisit once there
# is a previous tag to diff against and the generated range is meaningful.
changelog:
  disable: true

release:
  github:
    owner: dereksantos
    name: cortex
  draft: false
  prerelease: auto
  header: |
    See [CHANGELOG.md](https://github.com/dereksantos/cortex/blob/main/CHANGELOG.md)
    for the curated summary of this release. Install:

    ```bash
    curl -fsSL https://raw.githubusercontent.com/dereksantos/cortex/main/scripts/install.sh | bash
    ```

# No Homebrew tap. Deliberate: a tap is a second distribution channel with
# its own repo and a long-lived cross-repo write token, and the curl
# installer plus `go install` already cover macOS and Linux. Revisit only
# if there's real demand.
